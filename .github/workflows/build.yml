name: build-nginx-android

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (e.g. 1.28.0)"
        required: true
        default: "1.28.0"
  push:
    branches: [ main ]

env:
  NDK_VERSION: r27c
  ANDROID_API: "24"
  PCRE2_VERSION: "10.44"
  OPENSSL_VERSION: "3.5.0"
  NGINX_PREFIX: "/data/data/com.nginx.app/nginx" # 定义工作目录

jobs:
  build:
    name: nginx-${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
            openssl_target: android64-aarch64
          - abi: x86_64
            triple: x86_64-linux-android
            openssl_target: android-x86_64

    env:
      NGINX_VERSION: ${{ inputs.nginx_version || '1.28.0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake unzip curl file binutils perl

      - name: Cache NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-linux-x64

      - name: Download NDK ${{ env.NDK_VERSION }}
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          curl -fSL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Export toolchain env
        run: |
          set -euxo pipefail
          NDK_ROOT="$RUNNER_TEMP/android-ndk-${NDK_VERSION}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "SYSROOT=$SYSROOT"
            echo "CC=$TOOLCHAIN/bin/${{ matrix.triple }}${ANDROID_API}-clang"
            echo "CXX=$TOOLCHAIN/bin/${{ matrix.triple }}${ANDROID_API}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "DEPS=$RUNNER_TEMP/deps-${{ matrix.abi }}"
            echo "SRC=$RUNNER_TEMP/src"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/deps-${{ matrix.abi }}" "$RUNNER_TEMP/src"

      - name: Build PCRE2 (static)
        run: |
          set -euxo pipefail
          cd "$SRC"
          curl -fSL -o pcre2.tar.gz \
            "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz"
          tar xf pcre2.tar.gz
          cmake -S "pcre2-${PCRE2_VERSION}" -B pcre2-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DPCRE2_BUILD_PCRE2_8=ON \
            -DPCRE2_BUILD_PCRE2_16=OFF \
            -DPCRE2_BUILD_PCRE2_32=OFF \
            -DPCRE2_BUILD_TESTS=OFF \
            -DPCRE2_SUPPORT_JIT=OFF
          cmake --build pcre2-build --parallel "$(nproc)"
          cmake --install pcre2-build

      - name: Fetch nginx & OpenSSL sources
        run: |
          set -euxo pipefail
          cd "$SRC"
          curl -fSL -o nginx.tar.gz "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar xf nginx.tar.gz
          curl -fSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf openssl.tar.gz
          ls -d nginx-* openssl-*

      - name: Patch auto/types/sizeof for cross-compile
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path('auto/types/sizeof')
          s = p.read_text()
          s = s.replace('ngx_size=`$NGX_AUTOTEST`',
                        'ngx_size=`$NGX_AUTOTEST 2>/dev/null || true`')
          fallback = (
              'if [ -z "$ngx_size" ]; then\n'
              '    case "$ngx_type" in\n'
              '        int|int32_t|uint32_t|sig_atomic_t) ngx_size=4 ;;\n'
              '        *)                                 ngx_size=8 ;;\n'
              '    esac\n'
              '    echo " (cross: forcing $ngx_size)"\n'
              'fi\n'
          )
          s2, n = re.subn(r'(?m)^[ \t]*case \$ngx_size in',
                          lambda m: fallback + m.group(0), s, count=1)
          if n == 0:
              sys.exit('patch anchor "case $ngx_size in" not found')
          p.write_text(s2)
          print('auto/types/sizeof patched')
          PY

      - name: Configure nginx
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"

          ./configure \
            --prefix="$NGINX_PREFIX" \
            --sbin-path=sbin/nginx \
            --conf-path=conf/nginx.conf \
            --pid-path=run/nginx.pid \
            --lock-path=run/nginx.lock \
            --error-log-path=logs/error.log \
            --http-log-path=logs/access.log \
            --with-cc="$CC" \
            --with-cc-opt="-O2 -fPIC -I$DEPS/include -I$SYSROOT/usr/include" \
            --with-ld-opt="-fPIE -pie -L$DEPS/lib -L$SYSROOT/usr/lib/${{ matrix.triple }} -lz" \
            --with-pcre="$DEPS" \
            --with-openssl="$SRC/openssl-${OPENSSL_VERSION}" \
            --with-openssl-opt="no-shared no-tests no-comp -D__ANDROID_API__=${ANDROID_API} -fPIC ${{ matrix.openssl_target }}" \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_gzip_static_module \
            --with-http_stub_status_module \
            --with-threads \
            --without-mail_pop3_module \
            --without-mail_imap_module \
            --without-mail_smtp_module \
            --without-stream

      - name: Build & install
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"
          make -j"$(nproc)"
          
          # 安装到 staging 的绝对路径下
          make install DESTDIR="$RUNNER_TEMP/stage"

          BIN="$RUNNER_TEMP/stage/${NGINX_PREFIX}/sbin/nginx"
          "$STRIP" --strip-unneeded "$BIN"
          file "$BIN"
          "$TOOLCHAIN/bin/llvm-readelf" -d "$BIN" | head -30

      - name: Generate sample nginx.conf
        run: |
          set -euxo pipefail
          CONF="$RUNNER_TEMP/stage/${NGINX_PREFIX}/conf/nginx.conf"
          cat > "$CONF" <<'EOF'
          # 注意：在 App 中运行时，无需传 -p 参数，默认会使用编译时的 prefix
          worker_processes  auto;
          error_log  logs/error.log warn;
          pid        run/nginx.pid;

          events {
              worker_connections  1024;
          }

          http {
              include       mime.types;
              default_type  application/octet-stream;
              sendfile        off;   # Android 上必须关

              server {
                  listen       8080;
                  server_name  localhost;

                  location / {
                      root   html;
                      index  index.html;
                  }
              }
          }
          EOF

      - name: Pack artifact
        run: |
          set -euxo pipefail
          # 直接进到目标目录下打包，解压出来就是干净的 sbin/ conf/ 等
          cd "$RUNNER_TEMP/stage/${NGINX_PREFIX}"
          
          # 自动建好所需的空目录
          mkdir -p run logs html
          
          tar -czf "$RUNNER_TEMP/nginx-${NGINX_VERSION}-${{ matrix.abi }}.tar.gz" .
          ls -lh "$RUNNER_TEMP"/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.NGINX_VERSION }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/nginx-${{ env.NGINX_VERSION }}-${{ matrix.abi }}.tar.gz
          if-no-files-found: error

      - name: Dump config.log on failure
        if: failure()
        run: |
          find "$SRC" -name config.log -maxdepth 4 -print -exec tail -120 {} \;
