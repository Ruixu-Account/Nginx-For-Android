name: build-nginx-android

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (e.g. 1.30.6)"
        required: true
        default: "1.30.6"

# 必须赋予写入权限，才能创建 Release 和 Tag
permissions:
  contents: write

env:
  NDK_VERSION: "27.3.13750724"
  ANDROID_API: "24"
  PCRE2_VERSION: "10.44"
  OPENSSL_VERSION: "3.5.0"
  NGINX_PREFIX: "/data/data/com.nginx.app/nginx"

jobs:
  build:
    name: nginx-${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
            openssl_target: android-arm64
          - abi: x86_64
            triple: x86_64-linux-android
            openssl_target: android-x86_64

    env:
      NGINX_VERSION: ${{ inputs.nginx_version || '1.30.6' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl file binutils perl wget

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: $ANDROID_HOME/ndk/${NDK_VERSION}
          key: ndk-${NDK_VERSION}

      - name: Pre-install NDK via SDK Manager
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" || true
          
      - name: Export toolchain env
        run: |
          set -euxo pipefail
          echo "NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          
          TOOLCHAIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "SYSROOT=$SYSROOT"
            echo "CC=$TOOLCHAIN/bin/${{ matrix.triple }}${ANDROID_API}-clang"
            echo "CXX=$TOOLCHAIN/bin/${{ matrix.triple }}${ANDROID_API}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "DEPS=$RUNNER_TEMP/deps-${{ matrix.abi }}"
            echo "SRC=$RUNNER_TEMP/src"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/deps-${{ matrix.abi }}" "$RUNNER_TEMP/src"

      - name: Cache PCRE2
        id: cache-pcre2
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps-${{ matrix.abi }}
          key: pcre2-${PCRE2_VERSION}-${{ matrix.abi }}

      - name: Build PCRE2 (static)
        if: steps.cache-pcre2.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "$SRC"
          curl -fSL -o pcre2.tar.gz \
            "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE2_VERSION}/pcre2-${PCRE2_VERSION}.tar.gz"
          tar xf pcre2.tar.gz
          cmake -S "pcre2-${PCRE2_VERSION}" -B pcre2-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DBUILD_SHARED_LIBS=OFF \
            -DPCRE2_BUILD_PCRE2_8=ON \
            -DPCRE2_BUILD_PCRE2_16=OFF \
            -DPCRE2_BUILD_PCRE2_32=OFF \
            -DPCRE2_BUILD_TESTS=OFF \
            -DPCRE2_SUPPORT_JIT=OFF
          cmake --build pcre2-build --parallel "$(nproc)"
          cmake --install pcre2-build

      - name: Fetch nginx & OpenSSL sources
        run: |
          set -euxo pipefail
          cd "$SRC"
          curl -fSL -o nginx.tar.gz "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar xf nginx.tar.gz
          curl -fSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf openssl.tar.gz
          ls -d nginx-* openssl-*

      - name: Patch auto scripts for cross-compile
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"
          
          python3 - <<'PY'
          import pathlib
          
          # 补丁 1：跳过 auto/feature 的运行测试，并强行加头文件
          p = pathlib.Path('auto/feature')
          s = p.read_text()
          s = s.replace('#include <sys/types.h>', '#include <sys/types.h>\n#include <stdint.h>\n#include <inttypes.h>\n#include <stddef.h>')
          s = s.replace('case "$ngx_feature_run" in', 'case "skip" in')
          p.write_text(s)

          # 补丁 2：修改 auto/types/sizeof，直接按类型输出字节数
          p = pathlib.Path('auto/types/sizeof')
          s = p.read_text()
          old_block = 'if [ -x $NGX_AUTOTEST ]; then\n    ngx_size=`$NGX_AUTOTEST`\n    echo " $ngx_size bytes"\nfi'
          new_block = 'ngx_size=8\nif [ "$ngx_type" = "int" ] || [ "$ngx_type" = "int32_t" ] || [ "$ngx_type" = "uint32_t" ] || [ "$ngx_type" = "sig_atomic_t" ]; then ngx_size=4; fi\nif [ "$ngx_type" = "short" ]; then ngx_size=2; fi\necho " $ngx_size bytes (forced)"'
          s = s.replace(old_block, new_block)
          p.write_text(s)

          # 补丁 3：彻底重写 auto/types/typedef
          p = pathlib.Path('auto/types/typedef')
          s = 'echo $ngx_n "checking for $ngx_type ...$ngx_c"\nngx_found=yes\nif test -n "$ngx_feature_name"; then\n    have=$ngx_have_feature . auto/have\nfi\necho " found"\n'
          p.write_text(s)

          # 补丁 4：彻底重写 auto/endianness
          p = pathlib.Path('auto/endianness')
          s = 'echo $ngx_n "checking for system byte ordering ...$ngx_c"\necho " little endian"\nhave=NGX_HAVE_LITTLE_ENDIAN . auto/have\n'
          p.write_text(s)

          # 补丁 5：彻底重写 auto/lib/pcre/conf
          p = pathlib.Path('auto/lib/pcre/conf')
          s = 'if [ "$NGX_PLATFORM" != win32 ]; then\necho "checking for PCRE2 library ... found (cross-compile bypass)"\nhave=NGX_PCRE . auto/have\nhave=NGX_PCRE2 . auto/have\nCORE_INCS="$CORE_INCS $DEPS/include"\nLINK_DEPS="$LINK_DEPS $DEPS/lib/libpcre2-8.a"\nCORE_LIBS="$CORE_LIBS $DEPS/lib/libpcre2-8.a"\nPCRE=YES\nPCRE_LIBRARY=PCRE2\nfi\n'
          p.write_text(s)

          # 补丁 6：干掉 auto/cc/name 的报错退出
          p = pathlib.Path('auto/cc/name')
          s = p.read_text()
          s = s.replace("if [ $ngx_found = no ]; then\n        echo\n        echo $0: error: C compiler $CC is not found\n        echo\n        exit 1\n    fi", "")
          p.write_text(s)

          # 补丁 7：清空测试阶段链接参数
          p = pathlib.Path('auto/cc/conf')
          s = p.read_text()
          s = s.replace('if test -n "$NGX_LD_OPT"; then', 'if false; then # patched: skip ld-opt check')
          s = s.replace('NGX_TEST_LD_OPT="$NGX_LD_OPT"', 'NGX_TEST_LD_OPT=""')
          p.write_text(s)

          # 补丁 8：给 ngx_files.c 强行注入 glob.h 头文件
          p = pathlib.Path('src/os/unix/ngx_files.c')
          s = p.read_text()
          if '#include <glob.h>' not in s:
              s = s.replace('#include <ngx_files.h>', '#include <ngx_files.h>\n#include <glob.h>')
              if '#include <glob.h>' not in s:
                  s = '#include <glob.h>\n' + s
              p.write_text(s)

          # 补丁 9：给 ngx_setaffinity.h 注入 sched.h
          p = pathlib.Path('src/os/unix/ngx_setaffinity.h')
          s = p.read_text()
          if '#include <sched.h>' not in s:
              s = s.replace('#if (NGX_HAVE_SCHED_SETAFFINITY)', '#if (NGX_HAVE_SCHED_SETAFFINITY)\n#include <sched.h>')
              p.write_text(s)

          # 补丁 10：解决 ngx_epoll_module.c 里的 EPOLLRDHUP 未定义/空宏问题
          p = pathlib.Path('src/event/modules/ngx_epoll_module.c')
          s = p.read_text()
          s = s.replace('#if (NGX_READ_EVENT != EPOLLIN|EPOLLRDHUP)', '#if 1')
          s = s.replace('#if (NGX_WRITE_EVENT != EPOLLOUT)', '#if 1')
          s = s.replace('#if (NGX_HAVE_EPOLLEXCLUSIVE && NGX_HAVE_EPOLLRDHUP)', '#if 1')
          s = s.replace('#if (NGX_HAVE_EPOLLRDHUP)', '#if 1')
          s = s.replace('#if (NGX_HAVE_EPOLLEXCLUSIVE)', '#if 1')
          p.write_text(s)
          print('ngx_epoll_module.c patched')
          PY

      - name: Configure nginx
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"

          # 加上了 -Wl,-z,max-page-size=16384 解决 TLS 对齐问题
          ./configure \
            --prefix="$NGINX_PREFIX" \
            --sbin-path=sbin/nginx \
            --conf-path=conf/nginx.conf \
            --pid-path=run/nginx.pid \
            --lock-path=run/nginx.lock \
            --error-log-path=logs/error.log \
            --http-log-path=logs/access.log \
            --with-cc="$CC" \
            --with-cc-opt="-O2 -fPIC -Wno-error=implicit-function-declaration -D_GNU_SOURCE -DEPOLLRDHUP=0x2000 -I$DEPS/include" \
            --with-ld-opt="-fPIE -pie -Wl,-z,max-page-size=16384 -L$DEPS/lib -L$SYSROOT/usr/lib/${{ matrix.triple }} -L$SYSROOT/usr/lib/${{ matrix.triple }}/${ANDROID_API} -lpcre2-8 -lz -latomic -lm" \
            --with-openssl="$SRC/openssl-${OPENSSL_VERSION}" \
            --with-openssl-opt="no-shared no-tests no-engine no-dso -D__ANDROID_API__=${ANDROID_API} -fPIC ${{ matrix.openssl_target }}" \
            --with-threads \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_auth_request_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_stub_status_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_realip_module \
            --with-stream_ssl_preread_module

      - name: Force patch generated configs
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"

          sed -i 's/#define NGX_HAVE_EPOLLEXCLUSIVE$/#define NGX_HAVE_EPOLLEXCLUSIVE 1/g' objs/ngx_auto_config.h || true
          sed -i 's/#define NGX_HAVE_EPOLLRDHUP$/#define NGX_HAVE_EPOLLRDHUP 1/g' objs/ngx_auto_config.h || true
          sed -i 's/#define NGX_HAVE_EVENTFD$/#define NGX_HAVE_EVENTFD 1/g' objs/ngx_auto_config.h || true
          sed -i 's/#define NGX_HAVE_FILE_AIO$/#define NGX_HAVE_FILE_AIO 1/g' objs/ngx_auto_config.h || true

          sed -i 's/-lpthread//g' objs/Makefile
          sed -i 's/-ldl//g' objs/Makefile

      - name: Build & install
        run: |
          set -euxo pipefail
          cd "$SRC/nginx-${NGINX_VERSION}"
          
          set +e
          make -j"$(nproc)" 2>&1 | tee /tmp/make.log
          MAKE_EXIT=${PIPESTATUS[0]}
          set -e
          
          if [ $MAKE_EXIT -ne 0 ]; then
            echo "=================================================="
            echo "=== MAKE FAILED! FILTERING RELEVANT ERRORS ==="
            echo "=================================================="
            grep -iE "error|undefined reference|cannot find|ld:|clang:|fatal|collect2" /tmp/make.log | tail -n 100 || true
            echo "=================================================="
            exit 1
          fi
          
          set -e
          make install DESTDIR="$RUNNER_TEMP/stage"

      - name: Fix TLS Alignment with termux-elf-cleaner
        run: |
          set -euxo pipefail
          # 下载并运行 termux-elf-cleaner 彻底修复 TLS 对齐问题
          wget -q https://github.com/termux/termux-elf-cleaner/releases/download/v2.0.0/termux-elf-cleaner
          chmod +x termux-elf-cleaner
          ./termux-elf-cleaner --api-level 24 "$RUNNER_TEMP/stage/${NGINX_PREFIX}/sbin/nginx"

          BIN="$RUNNER_TEMP/stage/${NGINX_PREFIX}/sbin/nginx"
          "$STRIP" --strip-unneeded "$BIN"
          file "$BIN"
          "$TOOLCHAIN/bin/llvm-readelf -d" "$BIN" | head -30

      - name: Create basic directories
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/stage/${NGINX_PREFIX}"
          mkdir -p run logs html conf
          
          cat > conf/nginx.conf <<'EOF'
          worker_processes auto;
          error_log logs/error.log warn;
          pid run/nginx.pid;
          events { worker_connections 1024; }
          http {
              include mime.types;
              default_type application/octet-stream;
              sendfile off;
              server {
                  listen 8080;
                  location / { root html; index index.html; }
              }
          }
          EOF

      - name: Pack artifact
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/stage/${NGINX_PREFIX}"
          tar -czf "$RUNNER_TEMP/nginx-${NGINX_VERSION}-${{ matrix.abi }}.tar.gz" .
          ls -lh "$RUNNER_TEMP"/*.tar.gz

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.NGINX_VERSION }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/nginx-${{ env.NGINX_VERSION }}-${{ matrix.abi }}.tar.gz
          if-no-files-found: ignore

      # ====== 发布到 GitHub Releases ======
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NGINX_VERSION }}
          name: Nginx ${{ env.NGINX_VERSION }} (Android ${{ matrix.abi }})
          body: |
            Auto-built Nginx ${{ env.NGINX_VERSION }} for Android (${{ matrix.abi }}).
            
            Built with:
            - NDK r27c (API 24)
            - OpenSSL 3.5.0
            - PCRE2 10.44
            
            Fully static linked, ready for Termux or Android App sandbox.
          files: ${{ runner.temp }}/nginx-${{ env.NGINX_VERSION }}-${{ matrix.abi }}.tar.gz
          draft: false
          prerelease: false

      - name: Dump config.log on failure
        if: failure()
        run: |
          find "$SRC" -name config.log -maxdepth 4 -print -exec tail -120 {} \;
